# A trimmed excerpt of LHCb's DIRAC configuration (2026-10-20): the storage
# elements test_storage.py checks URLs for, and nothing else.
Operations
{
  Defaults
  {
    DataManagement
    {
      AccessProtocols = srm,dips
    }
  }
}
Resources
{
  StorageElementBases
  {
    CERN-CTA
    {
      BackendType = Cta
      AccessProtocols = https,root
      WriteProtocols = https,root
      StageProtocols = https,root
      BringOnlineTimeout = 604800
      SEType = T1D0
      SpaceReservation = LHCb-Tape
      ArchiveTimeout = 86400
      CTA
      {
        Host = eosctalhcb.cern.ch
        Protocol = root
        Path = /eos/ctalhcb/archive/grid/
        Access = remote
      }
      GFAL2_HTTPS
      {
        Host = eosctalhcb.cern.ch
        Protocol = https
        Path = /eos/ctalhcb/archive/grid/
        Access = remote
        Port = 8444
      }
    }
    CERN-EOS
    {
      BackendType = Eos
      AccessProtocols = https,root
      WriteProtocols = https,root
      SEType = T0D1
      SpaceReservation = LHCb-Disk
      WLCGTokenBasePath = /eos/lhcb/grid
      TokenSupport = True
      GFAL2_XROOT
      {
        Host = eoslhcb.cern.ch
        Protocol = root
        Path = /eos/lhcb/grid/prod
        Access = remote
        SpaceToken = LHCb-Disk
      }
      GFAL2_HTTPS
      {
        Host = eoslhcb.cern.ch
        Protocol = https
        Path = /eos/lhcb/grid/prod
        Access = remote
      }
    }
    CNAF-Disk
    {
      BackendType = Storm
      AccessProtocols = file,https
      WriteProtocols = https
      SEType = T0D1
      SpaceReservation = LHCb-Disk
      WLCGTokenBasePath = /disk/lhcb/
      TokenSupport = True
      GFAL2_HTTPS
      {
        Host = xfer-lhcb.cr.cnaf.infn.it
        Port = 8443
        Protocol = https
        Path = /disk/
        Access = remote
      }
      File
      {
        Protocol = file
        Path = /storage/gpfs_lhcb/disk
        Host = localhost
        Access = local
      }
      GFAL2_XROOT
      {
        Host = xrootd-lhcb.cr.cnaf.infn.it
        Port = 1094
        Protocol = root
        Path = /storage/gpfs_lhcb/disk
        Access = remote
      }
    }
    GRIDKA-Disk
    {
      AccessProtocols = https,root
      WriteProtocols = https,root
      BackendType = dCache
      SEType = T0D1
      SpaceReservation = LHCb-Disk
      WLCGTokenBasePath = /pnfs/gridka.de/lhcb/
      TokenSupport = True
      GFAL2_XROOT
      {
        Host = lhcbdcache-kit.gridka.de
        Protocol = root
        Path = /pnfs/gridka.de/lhcb/LHCb-Disk/
        Access = remote
        Port = 1094
      }
      GFAL2_HTTPS
      {
        Host = lhcbdcache-kit.gridka.de
        Protocol = https
        Path = /pnfs/gridka.de/lhcb/LHCb-Disk/
        Access = remote
        Port = 2880
      }
    }
    GRIDKA-Tape
    {
      BackendType = dCache
      SpaceReservation = LHCb-Tape
      SEType = T1D0
      AccessProtocols = https
      WriteProtocols = https
      GFAL2_HTTPS
      {
        Host = lhcbdcache-kit-tape.gridka.de
        Protocol = https
        Path = /pnfs/gridka.de/lhcb/LHCb-Tape
        Access = remote
        Port = 2880
      }
    }
    Glasgow-Disk
    {
      BackendType = CEPH
      SEType = T0D1
      WriteProtocols = root,https
      AccessProtocols = root,https
      SpaceReservation = LHCb-Disk
      WLCGTokenBasePath = /cephfs/lhcb
      TokenSupport = True
      GFAL2_HTTPS
      {
        Host = cephc02.gla.scotgrid.ac.uk
        Protocol = https
        Path = /cephfs
        Access = remote
        Port = 1094
      }
      GFAL2_XROOT
      {
        Host = cephc02.gla.scotgrid.ac.uk
        Protocol = root
        Path = /cephfs
        Access = remote
        Port = 1094
      }
    }
    IN2P3-Disk
    {
      AccessProtocols = root,https
      WriteProtocols = https
      BackendType = dCache
      SpaceReservation = LHCb-Disk
      SEType = T0D1
      WLCGTokenBasePath = /pnfs/in2p3.fr/data/lhcb/
      TokenSupport = True
      GFAL2_XROOT
      {
        Host = ccxrootdlhcb.in2p3.fr
        Protocol = root
        Path = /pnfs/in2p3.fr/data/lhcb/LHCb-Disk/
        Access = remote
      }
      GFAL2_HTTPS
      {
        Host = ccdavlhcb.in2p3.fr
        Protocol = https
        Path = /pnfs/in2p3.fr/data/lhcb/LHCb-Disk/
        Access = remote
        Port = 2880
      }
    }
    PIC-Disk
    {
      BackendType = dCache
      AccessProtocols = root,https
      WriteProtocols = root,https
      SpaceReservation = LHCb-Disk
      WLCGTokenBasePath = /pnfs/pic.es/data/lhcb/
      TokenSupport = True
      SEType = T0D1
      GFAL2_XROOT
      {
        Host = xrootd.pic.es
        Protocol = root
        Path = /pnfs/pic.es/data/lhcb/LHCb-Disk
        Access = remote
      }
      GFAL2_HTTPS
      {
        Host = webdav-lhcbt1.pic.es
        Protocol = https
        Path = /pnfs/pic.es/data/lhcb/LHCb-Disk
        Access = remote
        Port = 8446
      }
    }
    RAL-ANTARES
    {
      BackendType = Cta
      AccessProtocols = https,root
      WriteProtocols = https,root
      StageProtocols = https,root
      SEType = T1D0
      SpaceReservation = LHCb-Tape
      ArchiveTimeout = 86400
      CTA
      {
        Host = antares.stfc.ac.uk
        Protocol = root
        Path = /eos/antares/prod/
        Access = remote
      }
      GFAL2_HTTPS
      {
        Host = antares.stfc.ac.uk
        Port = 9000
        Protocol = https
        Path = /eos/antares/prod/
        Access = remote
      }
    }
    RAL-ECHO
    {
      BackendType = Echo
      SpaceReservation = LHCb-Disk
      SEType = T0D1
      AccessProtocols = root,https
      WriteProtocols = https
      WLCGTokenBasePath = /
      TokenSupport = True
      XRootConfig
      {
        Host = xrootd.echo.stfc.ac.uk
        PluginName = Echo
        Protocol = root
        Path = lhcb:prod
        Access = remote
      }
      HTTPsConfig
      {
        Host = webdav.echo.stfc.ac.uk
        Port = 1094
        PluginName = Echo
        Protocol = https
        Path = lhcb:prod
        Access = remoteonly
      }
      HTTPsLocalConfig
      {
        Host = xrootd-gateway.echo.stfc.ac.uk
        Port = 1095
        PluginName = Echo
        Protocol = https
        Path = lhcb:prod
        Access = local
      }
    }
    SARA-Disk
    {
      BackendType = dCache
      AccessProtocols = root,https
      WriteProtocols = https
      SpaceReservation = LHCb-Disk
      SEType = T0D1
      WLCGTokenBasePath = /pnfs/grid.sara.nl/data/lhcb/
      TokenSupport = True
      GFAL2_XROOT
      {
        Host = xrootd.grid.surfsara.nl
        Protocol = root
        Path = /pnfs/grid.sara.nl/data/lhcb/LHCb-Disk
        Access = remote
      }
      GFAL2_HTTPS
      {
        Host = webdav.grid.surfsara.nl
        Port = 2883
        Protocol = https
        Path = /pnfs/grid.sara.nl/data/lhcb/LHCb-Disk
        Access = remote
      }
    }
    SARA-Tape
    {
      BackendType = dCache
      SEType = T1D0
      AccessProtocols = https
      WriteProtocols = https
      SpaceReservation = LHCb-Tape
      GFAL2_HTTPS
      {
        Host = webdav-tape.grid.surfsara.nl
        Port = 2882
        Protocol = https
        Path = /pnfs/grid.sara.nl/data/lhcb/LHCb-Tape
        Access = remote
      }
    }
  }
  StorageElements
  {
    CERN-ARCHIVE
    {
      BaseSE = CERN-CTA
      CTA
      {
        Path = /eos/ctalhcb/archive/grid/lhcb/archive
      }
      GFAL2_HTTPS
      {
        Path = /eos/ctalhcb/archive/grid/lhcb/archive
      }
    }
    CERN-DST-EOS
    {
      BaseSE = CERN-EOS
    }
    CERN-RAW
    {
      BaseSE = CERN-CTA
    }
    CERN-USER
    {
      BaseSE = CERN-EOS
      SpaceReservation = LHCb_USER
      GFAL2_XROOT
      {
        Path = /eos/lhcb/grid/user
        SpaceToken = LHCb_USER
      }
      GFAL2_HTTPS
      {
        Path = /eos/lhcb/grid/user
      }
    }
    CNAF-DST
    {
      BaseSE = CNAF-Disk
    }
    GRIDKA-ARCHIVE
    {
      BaseSE = GRIDKA-Tape
      GFAL2_HTTPS
      {
        Path = /pnfs/gridka.de/lhcb/LHCb-Tape/lhcb/archive
      }
    }
    GRIDKA-DST
    {
      BaseSE = GRIDKA-Disk
    }
    Glasgow-DST
    {
      BaseSE = Glasgow-Disk
    }
    IN2P3-USER
    {
      BaseSE = IN2P3-Disk
      SpaceReservation = LHCb_USER
      GFAL2_XROOT
      {
        Path = /pnfs/in2p3.fr/data/lhcb/LHCb_USER/
      }
      GFAL2_HTTPS
      {
        Path = /pnfs/in2p3.fr/data/lhcb/LHCb_USER/
      }
    }
    PIC-DST
    {
      BaseSE = PIC-Disk
      GFAL2_XROOT
      {
        Path = /pnfs/pic.es/data/lhcb/LHCb-Disk
      }
      GFAL2_HTTPS
      {
        Path = /pnfs/pic.es/data/lhcb/LHCb-Disk
      }
    }
    RAL-ARCHIVE
    {
      BaseSE = RAL-ANTARES
      CTA
      {
        Path = /eos/antares/prod/lhcb/archive/
      }
      GFAL2_HTTPS
      {
        Path = /eos/antares/prod/lhcb/archive/
      }
    }
    RAL-DST
    {
      BaseSE = RAL-ECHO
    }
    RAL-USER
    {
      BaseSE = RAL-ECHO
      XRootConfig
      {
        PluginName = Echo
        Path = lhcb:user
      }
      HTTPsConfig
      {
        PluginName = Echo
        Path = lhcb:user
      }
      HTTPsLocalConfig
      {
        PluginName = Echo
        Path = lhcb:user
      }
    }
    SARA-DST
    {
      BaseSE = SARA-Disk
    }
    SARA-RAW
    {
      BaseSE = SARA-Tape
    }
  }
}
